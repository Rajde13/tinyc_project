<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>tinyc pipeline inspector</title>
    <!-- Fonts are optional: without internet the page falls back to system fonts. -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="app">
        <header><b>tinyc</b><span class="mu">pipeline inspector</span><select id="ex"
                aria-label="Example program"></select><span id="stat"></span></header>
        <div id="main">
            <section>
                <div class="ph">source.tc</div>
                <div id="eb">
                    <div id="gut"></div>
                    <div id="ew">
                        <pre id="mir"></pre><textarea id="src" spellcheck="false" wrap="off"
                            aria-label="Source code"></textarea>
                    </div>
                </div>
                <div id="msg"></div>
            </section>
            <section id="cv">
                <div id="world"><svg id="edges"></svg></div>
                <div id="tools"><button id="zo" aria-label="Zoom out">-</button><button id="zi"
                        aria-label="Zoom in">+</button><button id="fit">fit</button></div><svg id="mm"></svg>
            </section>
            <section>
                <div id="tabs"></div>
                <div id="pane"></div>
            </section>
        </div>
    </div>
    <!-- Plain scripts (no modules) so this works by double-clicking index.html. Order matters. -->
    <script src="js/utils.js"></script>
    <script src="js/examples.js"></script>
    <script src="js/lexer.js"></script>
    <script src="js/parser.js"></script>
    <script src="js/semantic.js"></script>
    <script src="js/ir.js"></script>
    <script src="js/bytecode.js"></script>
    <script src="js/vm.js"></script>
    <script src="js/state.js"></script>
    <script src="js/canvas.js"></script>
    <script src="js/inspector.js"></script>
    <script src="js/highlight.js"></script>
    <script src="js/viewport.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
